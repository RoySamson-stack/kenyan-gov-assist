name: Kenyan Gov Assist CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Backend tests
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install --no-cache-dir -r requirements.txt
        pip install pytest pytest-cov
      working-directory: ./backend
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=app --cov-report=xml
      working-directory: ./backend
      env:
        OLLAMA_BASE_URL: http://localhost:11434
    
    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./backend/coverage.xml
        fail_below: 50

  # Frontend tests
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend
    
    - name: Run linter
      run: npm run lint || true
      working-directory: ./frontend
    
    - name: Build frontend
      run: npm run build
      working-directory: ./frontend

  # Docker build
  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend Docker image
      run: docker build -t kenyan-gov-backend:latest ./backend
    
    - name: Build frontend Docker image
      run: docker build -t kenyan-gov-frontend:latest ./frontend
    
    - name: Test Docker compose
      run: |
        docker-compose config
        docker-compose up -d
        sleep 30
        curl -f http://localhost:8001/api/health || exit 1
        docker-compose down

  # Security scan
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'kenyan-gov-backend:latest'
        format: 'table'
        exit-code: '0'  # Don't fail build, just report
