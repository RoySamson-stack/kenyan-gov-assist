version: '3.8'

services:
  # Ollama service for LLM
  ollama:
    image: ollama/ollama:latest
    container_name: kenyan-gov-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - kenyan-gov-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "ollama serve &
      sleep 5 &&
      ollama pull kenyan-assistant &&
      wait"

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kenyan-gov-backend
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=kenyan-assistant
      - APP_NAME=Universal Translation Assistant
      - CORS_ORIGINS=http://frontend:3000,http://localhost:3000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - kenyan-gov-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kenyan-gov-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend
    networks:
      - kenyan-gov-network
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:alpine
    container_name: kenyan-gov-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kenyan-gov-network
    restart: unless-stopped


  # Curriculum/document translation backend copied from Translation_Backend
  curriculum-db:
    image: postgres:15-alpine
    container_name: kenyan-gov-curriculum-db
    environment:
      POSTGRES_USER: curriculum_user
      POSTGRES_PASSWORD: ${CURRICULUM_DB_PASSWORD:-curriculum_dev_password}
      POSTGRES_DB: curriculum_db
    volumes:
      - curriculum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculum_user -d curriculum_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kenyan-gov-network
    restart: unless-stopped

  curriculum-redis:
    image: redis:7-alpine
    container_name: kenyan-gov-curriculum-redis
    command: redis-server --requirepass ${CURRICULUM_REDIS_PASSWORD:-curriculum_redis_password}
    volumes:
      - curriculum_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${CURRICULUM_REDIS_PASSWORD:-curriculum_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kenyan-gov-network
    restart: unless-stopped

  curriculum-libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: kenyan-gov-curriculum-libretranslate
    environment:
      LT_DISABLE_FILES: "true"
      LT_DISABLE_METRICS: "true"
    volumes:
      - curriculum_libretranslate_data:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    networks:
      - kenyan-gov-network
    restart: unless-stopped

  curriculum-translation-backend:
    build:
      context: ./curriculum_translation_backend
      dockerfile: Dockerfile
    container_name: kenyan-gov-curriculum-backend
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://curriculum_user:${CURRICULUM_DB_PASSWORD:-curriculum_dev_password}@curriculum-db/curriculum_db
      REDIS_URL: redis://:${CURRICULUM_REDIS_PASSWORD:-curriculum_redis_password}@curriculum-redis:6379/0
      SECRET_KEY: ${CURRICULUM_SECRET_KEY:-change-me-in-production}
      LIBRETRANSLATE_URL: http://curriculum-libretranslate:5000
      STORAGE_ROOT: /app/storage
      DB_PASSWORD: ${CURRICULUM_DB_PASSWORD:-curriculum_dev_password}
      REDIS_PASSWORD: ${CURRICULUM_REDIS_PASSWORD:-curriculum_redis_password}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    volumes:
      - ./curriculum_translation_backend/storage:/app/storage
    depends_on:
      curriculum-db:
        condition: service_healthy
      curriculum-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kenyan-gov-network
    restart: unless-stopped

  curriculum-celery-worker:
    build:
      context: ./curriculum_translation_backend
      dockerfile: Dockerfile
    container_name: kenyan-gov-curriculum-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://curriculum_user:${CURRICULUM_DB_PASSWORD:-curriculum_dev_password}@curriculum-db/curriculum_db
      REDIS_URL: redis://:${CURRICULUM_REDIS_PASSWORD:-curriculum_redis_password}@curriculum-redis:6379/0
      SECRET_KEY: ${CURRICULUM_SECRET_KEY:-change-me-in-production}
      LIBRETRANSLATE_URL: http://curriculum-libretranslate:5000
      STORAGE_ROOT: /app/storage
      DB_PASSWORD: ${CURRICULUM_DB_PASSWORD:-curriculum_dev_password}
      REDIS_PASSWORD: ${CURRICULUM_REDIS_PASSWORD:-curriculum_redis_password}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    volumes:
      - ./curriculum_translation_backend/storage:/app/storage
    depends_on:
      curriculum-db:
        condition: service_healthy
      curriculum-redis:
        condition: service_healthy
      curriculum-libretranslate:
        condition: service_healthy
    networks:
      - kenyan-gov-network
    restart: unless-stopped

  curriculum-flower:
    build:
      context: ./curriculum_translation_backend
      dockerfile: Dockerfile
    container_name: kenyan-gov-curriculum-flower
    command: celery -A app.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://curriculum_user:${CURRICULUM_DB_PASSWORD:-curriculum_dev_password}@curriculum-db/curriculum_db
      REDIS_URL: redis://:${CURRICULUM_REDIS_PASSWORD:-curriculum_redis_password}@curriculum-redis:6379/0
      SECRET_KEY: ${CURRICULUM_SECRET_KEY:-change-me-in-production}
      LIBRETRANSLATE_URL: http://curriculum-libretranslate:5000
      STORAGE_ROOT: /app/storage
      DB_PASSWORD: ${CURRICULUM_DB_PASSWORD:-curriculum_dev_password}
      REDIS_PASSWORD: ${CURRICULUM_REDIS_PASSWORD:-curriculum_redis_password}
    depends_on:
      curriculum-redis:
        condition: service_healthy
    networks:
      - kenyan-gov-network
    restart: unless-stopped

networks:
  kenyan-gov-network:
    driver: bridge

volumes:
  ollama_data:
  redis_data:
  curriculum_pgdata:
  curriculum_redisdata:
  curriculum_libretranslate_data:
